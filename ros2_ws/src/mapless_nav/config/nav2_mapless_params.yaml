# =============================================================================
# Mapless Navigation Configuration
# =============================================================================
# This configuration is designed for mapless navigation using only local costmap
# with multi-LiDAR fusion point cloud as obstacle source.
#
# Key features:
# - NO static_layer (no map required)
# - rolling_window: true (costmap moves with robot)
# - voxel_layer for 3D obstacle detection
# - Person following mode support

# =============================================================================
# BT Navigator
# =============================================================================
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: odom
    robot_base_frame: base_link
    odom_topic: /odom
    
    # Use default navigating behavior tree
    default_nav_to_pose_bt_xml: ''
    
    # Plugin list
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node

# =============================================================================
# Controller Server
# =============================================================================
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    
    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    
    # Goal checker
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: True
    
    # Regulated Pure Pursuit Controller (recommended for following)
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      
      # Base parameters
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      
      # Rotation behavior
      rotate_to_heading_angular_vel: 1.0
      rotate_to_heading_min_angle: 0.785  # 45 degrees
      
      # Transform tolerance
      transform_tolerance: 0.1
      
      # Velocity limits
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      
      # Cost-based velocity regulation
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.3
      cost_scaling_gain: 3.0
      inflation_cost_scaling_factor: 3.0
      
      # Collision checking
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

# =============================================================================
# Local Costmap (CRITICAL for Mapless Navigation)
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      
      # Frame configuration
      global_frame: odom
      robot_base_frame: base_link
      
      # Update rate
      update_frequency: 10.0
      publish_frequency: 5.0
      
      # CRITICAL: Rolling window mode for mapless navigation
      rolling_window: true
      
      # Costmap size (meters) - MUST be integer for Nav2 Humble
      width: 10
      height: 10
      resolution: 0.05
      
      # Robot footprint (circular approximation)
      robot_radius: 0.3
      # Or use polygon:
      # footprint: "[[0.25, 0.15], [0.25, -0.15], [-0.25, -0.15], [-0.25, 0.15]]"
      
      # IMPORTANT: NO static_layer for mapless navigation!
      plugins: ["voxel_layer", "inflation_layer"]
      
      # ---------------------------------------------------------------------
      # Voxel Layer (3D obstacle detection from fused point cloud)
      # ---------------------------------------------------------------------
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        
        # CRITICAL: Transform tolerance for sensor data
        # Increased to 3.0 seconds to handle L2 LiDAR timestamp issues
        transform_tolerance: 3.0
        
        # Footprint clearing
        footprint_clearing_enabled: true
        
        # Height parameters (in robot frame)
        max_obstacle_height: 2.0
        min_obstacle_height: 0.0
        
        # Origin (for voxel grid)
        origin_z: 0.0
        z_resolution: 0.2
        z_voxels: 10
        
        # Unknown space handling
        unknown_threshold: 15
        mark_threshold: 0
        
        # Combination method
        combination_method: 1  # Maximum
        
        # Observation sources - FUSED POINT CLOUD
        observation_sources: fused_scan l2_scan mid70_scan depth_scan
        
        # Fused point cloud (primary source)
        fused_scan:
          topic: /fused_pointcloud
          data_type: "PointCloud2"
          sensor_frame: "base_link"
          observation_persistence: 0.0
          expected_update_rate: 0.0
          
          # Marking and clearing
          marking: true
          clearing: true
          
          # Range limits
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.3
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
        
        # Unitree L2 (backup/direct)
        l2_scan:
          topic: /unilidar/cloud
          data_type: "PointCloud2"
          sensor_frame: "unilidar_lidar"
          marking: true
          clearing: true
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          obstacle_max_range: 50.0
          obstacle_min_range: 0.3
          raytrace_max_range: 55.0
          raytrace_min_range: 0.0
        
        # Mid-70 (forward scanning)
        mid70_scan:
          topic: /livox/lidar
          data_type: "PointCloud2"
          sensor_frame: "livox_frame"
          marking: true
          clearing: true
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          obstacle_max_range: 25.0
          obstacle_min_range: 0.3
          raytrace_max_range: 30.0
          raytrace_min_range: 0.0
        
        # Depth camera point cloud
        depth_scan:
          topic: /berxel/depth/points
          data_type: "PointCloud2"
          sensor_frame: "berxel_depth_optical_frame"
          marking: true
          clearing: true
          min_obstacle_height: 0.1
          max_obstacle_height: 2.0
          obstacle_max_range: 5.0
          obstacle_min_range: 0.3
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
      
      # ---------------------------------------------------------------------
      # Inflation Layer (safety margins)
      # ---------------------------------------------------------------------
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        
        # Inflation parameters
        inflation_radius: 0.55
        cost_scaling_factor: 3.0
        
        # Inflation from obstacles only
        inflate_unknown: false
        inflate_around_unknown: false

# =============================================================================
# Global Costmap (minimal for mapless - only for basic planning)
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      
      global_frame: odom
      robot_base_frame: base_link
      
      update_frequency: 1.0
      publish_frequency: 1.0
      
      # For mapless: use rolling window as global costmap too
      rolling_window: true
      width: 20
      height: 20
      resolution: 0.1
      
      robot_radius: 0.3
      
      # Minimal plugins for mapless
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: fused_scan
        
        fused_scan:
          topic: /fused_pointcloud
          data_type: "PointCloud2"
          sensor_frame: "base_link"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          min_obstacle_height: 0.1
          obstacle_max_range: 10.0
          raytrace_max_range: 12.0
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

# =============================================================================
# Planner Server (for Nav2 path planning)
# =============================================================================
planner_server:
  ros__parameters:
    use_sim_time: false
    
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# =============================================================================
# Behavior Server (recovery behaviors)
# =============================================================================
behavior_server:
  ros__parameters:
    use_sim_time: false
    
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    
    behavior_plugins: ["spin", "backup", "wait"]
    
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    
    # Simulation time
    simulate_ahead_time: 2.0
    
    # Max durations
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# =============================================================================
# Velocity Smoother (optional but recommended)
# =============================================================================
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    
    max_velocity: [0.5, 0.0, 1.0]      # [x, y, theta]
    min_velocity: [-0.5, 0.0, -1.0]
    max_accel: [0.5, 0.0, 2.0]
    max_decel: [-0.5, 0.0, -2.0]
    
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
